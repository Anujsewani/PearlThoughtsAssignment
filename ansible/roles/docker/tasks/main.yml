- name: Install Docker
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Enable Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add ubuntu user to docker group
  user:
      name: ubuntu
      groups: docker
      append: yes

- name: Initialize Docker Swarm
  shell: docker swarm init || true

