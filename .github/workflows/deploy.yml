name: Deploy Yii2 on Push

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and clone + deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Set working directory
            #cd /home/ubuntu
            cd /home/ubuntu/PearlThoughtsAssignment

            # Pull latest code (if repo is already cloned)
            if [ -d ".git" ]; then
              git reset --hard
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} .
            fi
          #- name: Set up Docker
          #uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t sewani/yii2-app:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: docker push sewani/yii2-app:latest

      - name: SSH into EC2 and update
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sewani/yii2-app:latest
            docker stack deploy -c /home/ubuntu/PearlThoughtsAssignment/stack.yml yii2stack

